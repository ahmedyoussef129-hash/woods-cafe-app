<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<title>WOODS Cafe</title>
<style>
:root{--bg:#0b0b0f;--card:#15151c;--gold:#d9a441;--text:#f6f3ea;--muted:#a7a5ad;--green:#45c77a;--red:#e56b6f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:560px;margin:auto;padding-bottom:90px}.top{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(11,11,15,.96);z-index:5}
.brand{font-size:24px;font-weight:800}.brand span{color:var(--gold);font-style:italic}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--green)}
h2{font-size:20px;margin:18px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}.card{background:var(--card);border:1px solid #25252e;border-radius:16px;padding:15px}.k{color:var(--muted);font-size:12px}.v{font-size:22px;font-weight:800;margin-top:6px}
section{padding:0 14px}.panel{background:var(--card);border:1px solid #25252e;border-radius:18px;padding:16px;margin-top:12px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 6px}select,input,button{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px}select,input{background:#22222b;color:var(--text)}button{background:var(--gold);color:#15120b;font-weight:800;cursor:pointer}.secondary{background:#292932;color:var(--text)}.danger{background:#5a2529;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qty{display:flex;gap:8px;align-items:center}.qty button{width:48px;padding:10px}.qty input{text-align:center}.product{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#202028;padding:12px;border-radius:12px;margin:7px 0}.product small{color:var(--muted)}.product button{width:auto;padding:9px 13px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:#111116;border-top:1px solid #292932;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{background:transparent;color:var(--muted);font-size:12px;padding:9px 4px}.nav button.active{color:var(--gold)}
.hide{display:none}.msg{padding:10px;border-radius:12px;margin-top:10px;font-size:13px;background:#22222b}.success{border:1px solid #286d45}.error{border:1px solid #81363a}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:right;padding:8px;border-bottom:1px solid #292932}th{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">WOODS <span>Cafe</span></div><div id="status" class="status">جاري الاتصال...</div></header>

<div id="home">
<h2>لوحة التحكم</h2>
<div class="grid">
<div class="card"><div class="k">المبيعات</div><div class="v" id="kSales">0.00</div></div>
<div class="card"><div class="k">عدد المبيعات</div><div class="v" id="kCount">0</div></div>
<div class="card"><div class="k">قيمة المخزن</div><div class="v" id="kInv">0.00</div></div>
<div class="card"><div class="k">تكلفة المبيعات</div><div class="v" id="kCogs">0.00</div></div>
</div>
<section><div class="panel"><b>آخر المبيعات</b><div id="recent" class="msg">جاري التحميل...</div></div></section>
</div>

<div id="sales" class="hide">
<h2>تسجيل بيع 💰</h2>
<section><div class="panel">
<label>الصنف</label><select id="product"></select>
<div class="row">
<div><label>الكمية</label><div class="qty"><button type="button" onclick="changeQty(-1)">−</button><input id="qty" type="number" min="1" value="1"><button type="button" onclick="changeQty(1)">+</button></div></div>
<div><label>نوع البيع</label><select id="saleType"><option>Guest عادي</option><option>أصحاب الكافيه</option><option>Manager</option></select></div>
</div>
<button style="margin-top:14px" onclick="makeSale()">تسجيل البيع</button>
<div id="saleMsg"></div>
</div></section>
<section><div class="panel"><b>الأصناف</b><div id="products"></div></div></section>
</div>

<div id="inventory" class="hide">
<h2>المخزن 📦</h2>
<section><div class="panel"><div id="inventoryList">جاري التحميل...</div></div></section>
</div>

<div id="more" class="hide">
<h2>المزيد</h2>
<section><div class="panel">
<p>السيرفر: <span id="serverUrl"></span></p>
<button class="secondary" onclick="refreshAll()">تحديث البيانات</button>
</div></section>
</div>

<nav class="nav">
<button class="active" onclick="showTab('home',this)">الرئيسية</button>
<button onclick="showTab('sales',this)">المبيعات</button>
<button onclick="showTab('inventory',this)">المخزن</button>
<button onclick="showTab('more',this)">المزيد</button>
</nav>
</div>

<script>
const API="https://Ahmedofsa129.pythonanywhere.com";
let productsData=[];

function money(n){return Number(n||0).toFixed(2)}
function showTab(id,btn){
  ["home","sales","inventory","more"].forEach(x=>document.getElementById(x).classList.toggle("hide",x!==id));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active")); btn.classList.add("active");
  if(id==="inventory") loadInventory();
  if(id==="home") loadDashboard();
}
async function api(path,options={}){
  const r=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.detail||"حدث خطأ في السيرفر");
  return data;
}
async function loadProducts(){
  productsData=await api("/api/products");
  const sel=document.getElementById("product");
  sel.innerHTML=productsData.map(p=>`<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)} — ${money(p.base_price)} جنيه</option>`).join("");
  document.getElementById("products").innerHTML=productsData.map(p=>`<div class="product"><div><b>${escapeHtml(p.name)}</b><br><small>${money(p.base_price)} جنيه</small></div><button onclick="pickProduct('${jsEscape(p.name)}')">اختيار</button></div>`).join("");
}
function pickProduct(name){document.getElementById("product").value=name;showTab("sales",document.querySelectorAll(".nav button")[1])}
function changeQty(n){let x=Math.max(1,Number(document.getElementById("qty").value||1)+n);document.getElementById("qty").value=x}
async function makeSale(){
  const msg=document.getElementById("saleMsg");msg.innerHTML="";
  try{
    const data=await api("/api/sales",{method:"POST",body:JSON.stringify({
      product_name:document.getElementById("product").value,
      qty:Number(document.getElementById("qty").value),
      sale_type:document.getElementById("saleType").value
    })});
    msg.className="msg success";msg.innerHTML=`تم تسجيل البيع ✅<br>الإجمالي: <b>${money(data.total)} جنيه</b><br>تكلفة المبيعات: ${money(data.cogs)} — الربح الإجمالي: ${money(data.gross_profit)}`;
    document.getElementById("qty").value=1;
    await loadDashboard(); await loadInventory();
  }catch(e){msg.className="msg error";msg.textContent=e.message}
}
async function loadDashboard(){
  try{
    const sales=await api("/api/sales?limit=100");
    const inv=await api("/api/inventory");
    document.getElementById("kSales").textContent=money(sales.reduce((a,x)=>a+Number(x.total),0));
    document.getElementById("kCount").textContent=sales.length;
    document.getElementById("kCogs").textContent=money(sales.reduce((a,x)=>a+Number(x.cogs),0));
    document.getElementById("kInv").textContent=money(inv.reduce((a,x)=>a+Number(x.balance)*Number(x.unit_cost),0));
    document.getElementById("recent").innerHTML=sales.length?sales.slice(0,8).map(x=>`<div style="padding:7px 0;border-bottom:1px solid #292932"><b>${escapeHtml(x.product_name)}</b> × ${x.qty}<br><small>${escapeHtml(x.sale_type)} — ${money(x.total)} جنيه</small></div>`).join(""):"لا توجد مبيعات بعد";
  }catch(e){document.getElementById("recent").textContent=e.message}
}
async function loadInventory(){
  const box=document.getElementById("inventoryList");
  try{
    const inv=await api("/api/inventory");
    box.innerHTML=inv.length?`<table><tr><th>الصنف</th><th>الرصيد</th><th>الوحدة</th><th>القيمة</th></tr>${inv.map(x=>`<tr><td>${escapeHtml(x.item_name)}</td><td>${money(x.balance)}</td><td>${escapeHtml(x.unit)}</td><td>${money(Number(x.balance)*Number(x.unit_cost))}</td></tr>`).join("")}</table>`:"المخزن فارغ حاليًا";
  }catch(e){box.textContent=e.message}
}
async function refreshAll(){
  await loadProducts();await loadDashboard();await loadInventory();
  const s=document.getElementById("status");s.textContent="متصل ✓";s.className="status ok";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function jsEscape(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
document.getElementById("serverUrl").textContent=API;
refreshAll().catch(()=>{document.getElementById("status").textContent="تعذر الاتصال";});
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
